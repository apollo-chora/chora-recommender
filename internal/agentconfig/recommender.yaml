# content_recommender — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (mirrors qgen CR 2026-06-01): this YAML declares the
# recommender's tier and prompt version. Mana is a token-budget QUOTA system
# (manaplugin gate), NOT a model selector — the tieredmodelplugin is
# DELIBERATELY NOT registered (see cmd/recommender/main.go +
# feedback_mana_is_quota_not_model_selector). Model selection is env-driven
# here, not mana-driven.
#
# Tiers (mirrors qgen):
#   HIGH  = reasoning / ranking-quality agents
#   CHEAP = retrieval / scoring / light agents (no CHEAP sub-agent is wired in
#           this crew)
#
# The model itself is env-only: the gateway logical_model_id comes from the
# REQUIRED RECOMMENDER_MODEL env var and the declared fallback chain from the
# optional RECOMMENDER_FALLBACK_MODELS comma list; boot fails loud when the
# model var is unset — there is no literal fallback.
#
# The single sub-agent `recommend` IS the P1 ReAct ranker: it reasons over
# learner persona + topic_hint + the recommend_atoms tool's retrieval slate to
# RANK and JUSTIFY a 3-5 atom slate (daily-dose 40% slot). Ranking quality is
# the whole product, so it is HIGH tier.
#
# Recommender calls the model broker (chora-model-gateway) via
# modelgatewayclient, so the declared fallback chain feeds
# InvokeRequest.fallback_logical_model_ids and the gateway honours it.
# prompt_version selects the composer template version.
agent: content_recommender
sub_agents:
  recommend:
    tier: high
    prompt_version: v1
