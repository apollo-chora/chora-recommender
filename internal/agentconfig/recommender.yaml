# content_recommender — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN tiering (mirrors qgen CR 2026-06-01): this YAML is the single
# source of truth for the recommender's model tier. Mana is a token-budget
# QUOTA system (manaplugin gate), NOT a model selector — the tieredmodelplugin
# is DELIBERATELY NOT registered (see cmd/recommender/main.go +
# feedback_mana_is_quota_not_model_selector). Model selection is config-driven
# here, not mana-driven.
#
# Tiers (single-route deployment): every tier — HIGH reasoning / ranking-quality
# as well as CHEAP retrieval / scoring / light agents — now routes to the one
# logical model longcat-2.5-preview (LongCat-2.5-Preview via the
# chora-model-gateway registry). The old HIGH/CHEAP tier ladder collapsed to
# this single route; the `tier` field is retained as a descriptive label only.
#
# The single sub-agent `recommend` IS the P1 ReAct ranker: it reasons over
# learner persona + topic_hint + the recommend_atoms tool's retrieval slate to
# RANK and JUSTIFY a 3-5 atom slate (daily-dose 40% slot). Ranking quality is
# the whole product, so it stays the HIGH tier sub-agent — longcat-2.5-preview
# (fallback longcat-2.5-preview: single-provider deployment).
#
# Recommender calls the model broker (chora-model-gateway) via
# modelgatewayclient, so fallback_models feeds InvokeRequest.fallback_logical_
# model_ids and the gateway honours the chain. RECOMMENDER_MODEL may override
# the primary for quick ops experiments. prompt_version selects the composer
# template version.
agent: content_recommender
sub_agents:
  recommend:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
